name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Konfigurasi (Release WAJIB)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      # PENTING (dari log CI asli, error RC2135): `--parallel` nge-build SEMUA
      # target sekaligus - termasuk installer - padahal installer.rc butuh
      # ../build/yt-chat-overlay.dll + ../build/LalaLiveChatOverlay.exe yang
      # belum ada. Urutan wajib: build DLL + exe DULU, copy ke build/, BARU installer.
      - name: Build plugin DLL + exe overlay
        run: |
          cmake --build build --config Release --target yt-chat-overlay --parallel
          cmake --build build --config Release --target LalaLiveChatOverlay --parallel

      # installer.rc baca ../build/yt-chat-overlay.dll + ../build/LalaLiveChatOverlay.exe
      - name: Siapkan file buat installer
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Path build -Filter yt-chat-overlay.dll | Select-Object -First 1
          $exe = Get-ChildItem -Recurse -Path build -Filter LalaLiveChatOverlay.exe | Select-Object -First 1
          if (-not $dll) { Write-Error "yt-chat-overlay.dll nol ketemu"; exit 1 }
          if (-not $exe) { Write-Error "LalaLiveChatOverlay.exe nol ketemu"; exit 1 }
          Copy-Item $dll.FullName "$env:GITHUB_WORKSPACE\build\yt-chat-overlay.dll" -Force
          Copy-Item $exe.FullName "$env:GITHUB_WORKSPACE\build\LalaLiveChatOverlay.exe" -Force
          Get-ChildItem "$env:GITHUB_WORKSPACE\build\yt-chat-overlay.dll","$env:GITHUB_WORKSPACE\build\LalaLiveChatOverlay.exe" |
            Select-Object Name, Length

      - name: GATE - pastikan nol ada CRT debug di DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Path build -Filter yt-chat-overlay.dll | Select-Object -First 1
          if (-not $dll) { Write-Error "yt-chat-overlay.dll nol ketemu"; exit 1 }
          Write-Host "DLL: $($dll.FullName)"
          $bytes = [System.IO.File]::ReadAllBytes($dll.FullName)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          $bad = @('MSVCP140D.dll','VCRUNTIME140D.dll','VCRUNTIME140_1D.dll')
          $hit = @()
          foreach ($b in $bad) { if ($text.Contains($b)) { $hit += $b } }
          if ($hit.Count -gt 0) {
            Write-Error "DLL ini DEBUG BUILD - minta CRT debug: $($hit -join ', '). Set Release."
            exit 1
          }
          if (-not $text.Contains('MSVCP140.dll')) {
            Write-Host "Catatan: CRT statis kepakai (nol butuh VC++ Redist) - aman."
          }
          Write-Host "LULUS: nol ada CRT debug, DLL siap dipakai user."

      - name: Build installer (menyerap DLL + exe jadi resource)
        run: cmake --build build --config Release --target LalaLiveChatOverlaySetup --parallel

      - name: Kumpulin hasil
        uses: actions/upload-artifact@v4
        with:
          name: lala-chat-overlay-release
          path: |
            build/**/yt-chat-overlay.dll
            build/**/LalaLiveChatOverlay.exe
            build/**/LalaLiveChatOverlaySetup.exe
          if-no-files-found: warn
